name: Build NWGrabio Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build NWGrabio with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name NWGrabio `
            --icon icon.ico `
            --version-file file_version_info.txt `
            --collect-all imageio_ffmpeg `
            main.py
          if (-not (Test-Path "dist\NWGrabio\NWGrabio.exe")) {
            Write-Error "PyInstaller did not produce dist\NWGrabio\NWGrabio.exe. See the log above this step for the real error."
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build NWGrabio-Setup.exe installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: NWGrabio-Setup
          path: Output/NWGrabio-Setup.exe
