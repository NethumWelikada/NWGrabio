name: Build NWGrabio Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('android/buildozer.spec') }}

      - name: Cache buildozer local directory
        uses: actions/cache@v4
        with:
          path: android/.buildozer
          key: buildozer-local-${{ hashFiles('android/buildozer.spec') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install buildozer and cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build the APK
        working-directory: android
        run: |
          yes | buildozer android debug

      - name: Locate the built APK
        working-directory: android
        run: |
          echo "APK_PATH=$(find bin -name '*.apk' | head -n 1)" >> $GITHUB_ENV

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: NWGrabio-APK
          path: android/${{ env.APK_PATH }}
